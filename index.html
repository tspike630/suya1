<!doctype html>
<html lang="zh-CN" data-theme="reality">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黍琊：醒梦之间 · 设计文档</title>
    <meta
      name="description"
      content="《黍琊：醒梦之间》Galgame 设计文档 V1.0。故事、角色、五结局，以及可以亲手拨动的清醒账本。"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var theme = localStorage.getItem("suya-theme");
        if (theme === "dream" || theme === "reality") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        /* keep the default theme */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
