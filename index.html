<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黍琊：醒梦之间</title>
    <meta name="description" content="视觉小说《黍琊：醒梦之间》。在留下与醒来之间做出选择。" />
    <link rel="icon" href="./assets/favicon-DTh2_ao6.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="./assets/game.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/game.css">
  </head>
  <body style="margin:0;background:#120e0c;color:#f6efe6">
    <div id="app"></div>
    <script>
      window.addEventListener("error", function (event) {
        var app = document.querySelector("#app");
        if (!app || app.childElementCount) return;
        app.textContent = "页面没有启动：" + (event.message || "脚本加载失败");
      });
    </script>
  </body>
